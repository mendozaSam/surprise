 <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Surprise</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #121212;
      color: white;
      font-family: 'Courier New', monospace;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      flex-direction: column;
      overflow: hidden;
    }

    #message {
      font-size: 1.5em;
      white-space: pre-wrap;
      text-align: center;
      margin-bottom: 20px;
    }

    #openBtn {
      padding: 10px 20px;
      font-size: 1.2em;
      background-color: #ffb6c1;
      color: black;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }

    .flower {
      position: absolute;
      bottom: 0;
      transform: scale(0);
      animation: grow 2s forwards;
    }

    @keyframes grow {
      to {
        transform: scale(1);
      }
    }

    .flower svg {
      height: 100px;
    }

    audio {
      display: none;
    }
  </style>
</head>
<body>
  <div id="message"></div>
  <button id="openBtn">Open</button>
  <audio id="bgMusic" src="blue-instrumental.mp3" loop></audio>

  <script>
    const name = prompt("Hi! Sino ka?") || "Crush";
    const messageText = `Hi ${name},\nMay sorpresa ako sa’yo...`;

    const messageDiv = document.getElementById("message");
    const typeText = (text, el, cb) => {
      let i = 0;
      const interval = setInterval(() => {
        el.textContent += text[i];
        i++;
        if (i >= text.length) {
          clearInterval(interval);
          if (cb) cb();
        }
      }, 50);
    };

    typeText(messageText, messageDiv);

    document.getElementById("openBtn").addEventListener("click", () => {
      document.getElementById("openBtn").style.display = "none";
      document.body.style.background = "#fceef2";
      messageDiv.style.color = "#333";
      messageDiv.textContent = "Tingnan mo oh… Para sa’yo ‘to.";

      // Play background music
      const bgMusic = document.getElementById("bgMusic");
      bgMusic.play();

      // Grow multiple flowers
      for (let i = 0; i < 10; i++) {
        setTimeout(() => {
          const flower = document.createElement("div");
          flower.className = "flower";
          flower.style.left = `${10 + i * 8}%`;
          flower.innerHTML = `
            <svg viewBox="0 0 64 64">
              <line x1="32" y1="64" x2="32" y2="40" stroke="#2e8b57" stroke-width="4"/>
              <circle cx="32" cy="30" r="10" fill="#ff69b4"/>
            </svg>
          `;
          flower.style.animationDelay = `${i * 0.3}s`;
          document.body.appendChild(flower);
        }, i * 300);
      }
    });
  </script>
</body>
</html>
